# The TypeScript jobs, in parts that each stay within 30 minutes:
#   packages  the strict type check and every package's tests but the Studio's, with Chrome, Java and veraPDF,
#             LibreOffice, Firefox (the design locks in three engines); one combination of the design matrix
#   studio    the Studio's tests (quality, performance, audit, layout; Chrome, Firefox and WebKit)
#   designs   the full design matrix (every built-in theme under every example brand, built and checked) and the
#             solver's property tests at full size (LIBKA_DESIGN_FULL); weekly and on release tags
# Called by check.yml (pinned runner), weekly.yml and ubuntu-next.yml (the next image).
name: typescript

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner image
        type: string
        required: true
      part:
        description: packages, studio or designs
        type: string
        default: packages

permissions:
  contents: read

jobs:
  typescript:
    # the packages part keeps its earlier name, which the repository's required status check uses
    name: typescript (${{ inputs.part == 'packages' && 'packages/' || inputs.part }}${{ inputs.part == 'designs' && format(' {0}/3', matrix.shard) || '' }})
    runs-on: ${{ inputs.runs-on }}
    # the designs part runs in three shards side by side; the other parts once
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.part == 'designs' && '[1, 2, 3]' || '[1]') }}
    # all the tests in one job took 17 to 18 minutes in 2.0.3; the parts split them so each stays well inside the
    # limit, which is never raised (2.0.4 plan, 4b)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile only)
        run: pnpm install --frozen-lockfile

      # PDF/UA validation (docs/admin/verapdf.md): Java 21 and veraPDF in /opt/verapdf, required by the tests
      - if: inputs.part != 'studio'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # pinned to one version and its checksum (docs/admin/verapdf.md, "Updating" says how to move it)
      - name: Install veraPDF
        if: inputs.part != 'studio'
        env:
          VERAPDF_URL: https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip
          VERAPDF_SHA256: 6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838
        run: |
          curl -sSfL -o /tmp/verapdf.zip "$VERAPDF_URL"
          echo "$VERAPDF_SHA256  /tmp/verapdf.zip" | sha256sum -c -
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          cat > /tmp/verapdf-auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>/opt/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Batch files" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          sudo "$JAVA_HOME/bin/java" -jar /tmp/verapdf-installer/*/verapdf-izpack-installer-*.jar /tmp/verapdf-auto-install.xml
          /opt/verapdf/verapdf --version

      # Word files must open in a second office suite (docs/admin/word-and-libreoffice.md): LibreOffice Writer, headless
      - name: Install LibreOffice
        if: inputs.part != 'studio'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer
          soffice --version

      # the Studio's smoke tests in Firefox and WebKit (docs/admin/studio.md); Chrome is on the runner already
      - name: Install Firefox and WebKit for Playwright
        run: pnpm --filter @libka/studio exec playwright-core install --with-deps firefox webkit

      - name: Type check
        if: inputs.part == 'packages'
        run: pnpm typecheck

      - name: Tests (packages)
        if: inputs.part == 'packages'
        run: pnpm -r --filter '!@libka/studio' test
        env:
          LIBKA_REQUIRE_VERAPDF: '1'
          LIBKA_REQUIRE_LIBREOFFICE: '1'
          LIBKA_REQUIRE_BROWSERS: '1'

      - name: Tests (the Studio)
        if: inputs.part == 'studio'
        run: pnpm --filter @libka/studio test
        env:
          LIBKA_REQUIRE_BROWSERS: '1'
          # the Studio's time budgets hold on a developer machine; shared runners are slower, so they get twice the time
          LIBKA_PERF_SLACK: '2'

      # the solver's property tests at full size in the first shard, the matrix in three (about 24 minutes in all)
      - name: The solver at full size
        if: inputs.part == 'designs' && matrix.shard == 1
        run: pnpm --filter @libka/design test
        env:
          LIBKA_DESIGN_FULL: '1'

      - name: The design matrix, shard ${{ matrix.shard }} of 3
        if: inputs.part == 'designs'
        run: pnpm --filter @libka/cli exec vitest run test/designs.test.ts
        env:
          LIBKA_DESIGN_MATRIX: full
          LIBKA_DESIGN_SHARD: ${{ matrix.shard }}/3
          LIBKA_REQUIRE_VERAPDF: '1'
          LIBKA_REQUIRE_BROWSERS: '1'
