# Two jobs. "check" runs check.py in strict mode on Ubuntu and Windows: the Python tests, the token build and
# the check that no generated file is stale (the TypeScript workspace is not installed in this job, so check.py
# skips it; its browser stage runs only where check.extra.json names a self-check page). "typescript" installs
# the workspace and runs the type check and every TypeScript test, the Chrome ones included.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build scripts need Python 3.12+; 3.14 is the version the maintainers use. No dependencies.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Python tests, token build, generated files
        run: python check.py --ci --artifacts check-artifacts

      # On failure, keep the browser's view of the self-check page for diagnosis.
      - name: Upload self-check result
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-check-${{ matrix.os }}
          path: check-artifacts/
          retention-days: 14

  # Ubuntu is pinned so that a new ubuntu-latest image cannot break a release; ubuntu-next.yml tries
  # ubuntu-latest weekly, and the pin moves once it passes.
  typescript:
    uses: ./.github/workflows/typescript.yml
    with:
      runs-on: ubuntu-24.04
