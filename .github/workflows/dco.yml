# The Developer Certificate of Origin: every commit of a pull request is signed off by its author
# (CONTRIBUTING.md, "Sign-off"). No outside service: git reads the commits.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            signed="$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            case "$signed" in
              *"$author"*) ;;
              *) echo "::error::$(git log -1 --format='%h %s' "$sha"): no 'Signed-off-by: $author' line"
                 missing=1 ;;
            esac
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off each commit with git commit -s (or git rebase --signoff $BASE), then push again. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Every commit is signed off."
