# LibKa's npm packages: built once (npm/build.mts), then the quick start runs from the packed files alone on fresh
# Windows and Ubuntu runners (npm/smoke.mts): create a project, install, doctor, check, build with Guard, verify,
# the MCP server, the tokens and the Claude Desktop extension's server. Nothing is published.
name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build and pack the packages, the skill and the Desktop extension
        run: node npm/build.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/npm/
          retention-days: 14

  # a fresh runner with only Node.js and Chrome (both come with the image): no workspace, no pnpm
  quick-start:
    needs: pack
    name: quick start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: npm/smoke.mts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages-under-test
      - name: The quick start from the packed packages
        run: node npm/smoke.mts packages-under-test
