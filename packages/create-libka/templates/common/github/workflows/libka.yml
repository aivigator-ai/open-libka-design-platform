# Builds every LibKa document in docs/ with LibKa Guard on each push and pull request: Guard checks every output,
# marks each problem in the pull request (a problem in the source on its line, a finding in an output on its file),
# and the job fails on any finding. The outputs are kept as an artifact for 7 days (in a private repository,
# artifacts count toward the account's Actions storage). The runner has Google Chrome, which Guard needs. It has no
# veraPDF, so the PDFs are built but not validated against PDF/UA-1, and their manifests say so (libka doctor
# explains how to add it).
# A key made here signs the outputs; it is not in .libka/trusted-keys.json, so `libka verify` on these outputs reports it as not trusted.
# `cli` is the LibKa version CI runs: keep it the same as @libka/cli in package.json.
# CI writes the outputs beside the documents, in docs/dist/; `npm run build` writes them to dist/.
name: libka

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and check with LibKa Guard
        uses: {{owner}}/open-libka-guard-action@44484445fde039cea363d0d5703566fca56653af # v2.0.2
        with:
          documents: docs/*.md
          cli: '@libka/cli@{{version}}'
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libka-outputs
          path: docs/dist/
          retention-days: 7
          # a document that fails before any output is written leaves nothing to keep; Guard has said why
          if-no-files-found: ignore
