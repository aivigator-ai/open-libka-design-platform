# Builds and checks every LibKa document on each push and pull request, and keeps the outputs as an artifact.
# The runner has Google Chrome, which LibKa's checks need. It has no veraPDF, so the PDFs are built but not
# validated against PDF/UA-1, and their manifests say so (libka doctor explains how to add it).
# A key made here signs the outputs; it is not in .libka/trusted-keys.json, so verify reports it as not trusted.
name: libka

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check the source
        run: npm run check
      - name: Build (Guard checks every output)
        run: npm run build
      - name: Verify the signed outputs
        run: npm run verify
      - name: Keep the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libka-outputs
          path: dist/
          retention-days: 14
